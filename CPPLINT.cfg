# TinyReflection - cpplint configuration
# Reference: https://google.github.io/styleguide/cppguide.html

set noparent

# 行宽限制
linelength=80

# 过滤规则（减号 = 关闭，加号 = 开启）
filter=-build/include_subdir
# 项目使用 #pragma once 而非 #ifndef 守卫，关闭此项检查
filter=-build/header_guard
# 允许 C++11 及以上的头文件
filter=-build/c++11
# 关闭对第三方代码的版权声明检查
filter=-legal/copyright

# 需要检查的文件扩展名
extensions=h,hpp,cpp

# 指定头文件所在的根目录（用于 include 路径检查）
root=.
